services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo srvr | nc localhost 2181 | grep -q Mode']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ['/bin/bash', '/create-topics.sh']
    restart: 'no'

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./infra/clickhouse/init.sql:/init.sql:ro
    entrypoint:
      - clickhouse-client
      - --host
      - clickhouse
      - --multiquery
      - --queries-file
      - /init.sql
    restart: 'no'

  ai-service:
    build:
      context: ./log-processor-service/ai_service
      dockerfile: Dockerfile
    container_name: ai-service
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    ports:
      - '${AI_HTTP_PORT:-8000}:8000'
      - '${AI_GRPC_PORT:-50051}:50051'
    environment:
      CH_HOST: clickhouse
      CH_PORT: '8123'
      CH_DATABASE: observability
      CH_USER: default
      CH_PASSWORD: ''
      HTTP_PORT: '8000'
      GRPC_PORT: '50051'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ['--config=/etc/otelcol-contrib/config.yaml']

  # --- Application services (docker compose --profile apps up -d) ---

  log-processor-service:
    profiles: [apps]
    build: ./log-processor-service
    container_name: log-processor-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/observability
      APP_AI_GRPC_TARGET: ai-service:50051
      APP_AI_HTTP_BASE_URL: http://ai-service:8000
      APP_SECURITY_API_KEY: ${APP_SECURITY_API_KEY:-causr-local-key}

  cursr-backend:
    profiles: [apps]
    build: ./cursr_backend
    container_name: cursr-backend
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '8090:8090'
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/observability?compress=0
      APP_SECURITY_API_KEY: ${APP_SECURITY_API_KEY:-causr-local-key}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

  llm-router-service:
    profiles: [apps]
    build: ./llm-router-service
    container_name: llm-router-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    ports:
      - '${LLM_ROUTER_PORT:-8091}:8091'
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/observability?compress=0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}

  log-sender-backend:
    profiles: [apps]
    build: ./log-sender-backend
    container_name: log-sender-backend
    depends_on:
      otel-collector:
        condition: service_started
    ports:
      - '8082:8082'
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  causr-dashboard:
    profiles: [apps]
    build:
      context: ./causr-dashboard
      args:
        VITE_BFF_API_BASE: http://localhost:8090
        VITE_BFF_WS_URL: ws://localhost:8090/ws/anomalies
        VITE_API_KEY: ${APP_SECURITY_API_KEY:-causr-local-key}
        VITE_TENANT_ID: default
    container_name: causr-dashboard
    depends_on:
      - cursr-backend
    ports:
      - '5173:80'

volumes:
  clickhouse-data:
