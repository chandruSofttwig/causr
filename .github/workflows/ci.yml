name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - log-processor-service
          - cursr_backend
          - llm-router-service
          - log-sender-backend
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.module == 'log-processor-service' && '17' || '21' }}
          cache: maven
      - name: Test
        run: mvn -B test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causr-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: causr-dashboard/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
